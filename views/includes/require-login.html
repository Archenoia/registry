<section class="auth-placeholder" role="region" aria-label="需要登录才能查看此内容">
  <span class="badge"><span class="dot"></span>匿名访客 · 受限内容</span>

  <!-- 模糊背景：暗示真实内容就在后面 -->
  <div class="ghost" aria-hidden="true">
    <div class="ghost-inner">
      <div class="ghost-title"></div>
      <div class="ghost-row w-90"></div>
      <div class="ghost-row w-70"></div>
      <div class="ghost-media"></div>
      <div class="ghost-row w-90"></div>
      <div class="ghost-row w-50"></div>
      <div class="ghost-row w-70"></div>
      <div class="ghost-row w-40"></div>
    </div>
  </div>

  <div class="scrim" aria-hidden="true"></div>

  <!-- 主卡片 -->
  <div class="lock-card">
    <div class="lock-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" style="color:var(--accent);">
        <rect x="4.5" y="10.5" width="15" height="10" rx="2.2" />
        <path d="M7.5 10.5V7.5a4.5 4.5 0 0 1 9 0v3" />
      </svg>
    </div>

    <h2>内容已<em>锁定</em></h2>
    <p class="sub">
      您当前以<b>匿名访客</b>身份浏览，此页面的内容由作者限定为<b>已登录用户</b>可见。<br>
      请使用您的邮箱登录后继续查看。
    </p>

    <form>
      <div class="field">
        <a href="/login"> <input type="email" name="email" placeholder="you@example.com" readonly required></a>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="m3 7 9 6 9-6" />
        </svg>
      </div>
      <a class="btn btn-primary" role="button" href="/login/">使用邮箱继续</a>
    </form>

    <p class="hint">
      首次使用将自动为您创建账户。<br>
      遇到问题？<a href="#">查看登录帮助</a>
    </p>
  </div>
</section>
